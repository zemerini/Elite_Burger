<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum — In Arbeit | Elite Burger</title>
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wip-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-lg);
            padding: 50px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .wip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .wip-gear {
            width: 80px;
            height: 80px;
            color: var(--accent);
            margin: 0 auto 30px auto;
            animation: spin-gear-page 6s linear infinite;
        }

        @keyframes spin-gear-page {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wip-card h1 {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: var(--tracking-title);
            margin-bottom: 12px;
        }

        .wip-card h2 {
            font-family: var(--font-heading);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: var(--tracking-label);
            margin-bottom: 24px;
        }

        .wip-card p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.55;
            margin-bottom: 35px;
            text-wrap: pretty;
        }

        .btn-wip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 0 1.75rem;
            background: var(--accent);
            color: var(--bg-primary);
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: var(--tracking-ui);
            border-radius: var(--radius-pill);
            border: none;
            cursor: pointer;
            transition: transform 120ms var(--ease-out), box-shadow var(--transition-smooth), background var(--transition-fast);
            box-shadow: 0 6px 24px rgba(255, 102, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        @media (hover: hover) {
            .btn-wip:hover {
                background: var(--accent-hover);
                box-shadow: 0 10px 34px var(--accent-glow-strong), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            }
        }

        .btn-wip:active {
            transform: scale(0.97);
            background: var(--accent-pressed);
            transition-duration: 80ms;
        }

        @media (prefers-reduced-motion: reduce) {
            .wip-gear { animation: none; }
            .btn-wip:active { transform: none; }
        }
    </style>
</head>
<body>
    <div class="wip-card">
        <svg class="wip-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <h1>Impressum</h1>
        <h2>In Arbeit</h2>
        <p>Diese Seite wird aktuell noch überarbeitet. In Kürze finden Sie hier alle rechtlichen Informationen gemäß den gesetzlichen Vorgaben.</p>
        <a href="index.html" class="btn-wip">Zurück zur Startseite</a>
    </div>
</body>
</html>
